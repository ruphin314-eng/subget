http:
  method: GET
  url: "{{baseUrl}}/dashboard?periode=mois"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: periode
      value: mois
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
