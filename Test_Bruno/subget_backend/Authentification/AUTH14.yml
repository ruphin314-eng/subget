http:
  method: POST
  url: "{{baseUrl}}/auth/logout?Authorization=Bearer {{accessToken}}"
  params:
    - name: Authorization
      value: Bearer {{accessToken}}
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
