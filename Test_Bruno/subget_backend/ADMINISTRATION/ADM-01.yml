http:
  method: GET
  url: "{{baseUrl}}/admin/users"
  headers:
    - name: Authorization
      value: Bearer {{adminAccessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
