spring:
    application:
        name: subget_backend
    # Profil par défaut si aucun n'est activé explicitement (ex: en local sans -Dspring.profiles.active).
    # En prod, définir SPRING_PROFILES_ACTIVE=prod comme variable d'environnement.
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect

server:
    port: ${PORT:8080}
    error:
        # Ne jamais exposer de stack trace ni de message détaillé en prod (cahier des charges 5.4)
        include-stacktrace: never
        include-message: never

# Ces deux valeurs ne sont pas sensibles (juste des durées) donc communes aux deux profils.
# jwt.secret et admin.seed.* en revanche sont définis séparément par profil, voir plus bas.
jwt:
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 jours
